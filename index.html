/* portada */
.hero{background:linear-gradient(180deg,var(--forest2),var(--forest));color:#EEF2EC;border-radius:20px;overflow:hidden;position:relative;text-align:center}
.hero .in{padding:28px 20px 0;position:relative;z-index:1}
.hero .logo{width:280px;max-width:80vw;height:165px;height:calc(min(280px,80vw) * 0.588);margin:0 auto}
.hero h1{font-size:clamp(46px,12vw,84px);font-style:italic;margin-top:14px;color:#fff}
.hero h1 span{color:var(--orange)}
.hero p{color:#C3CEC6;max-width:30em;margin:10px auto 0}
.hero svg.ridge{display:block;width:100%;height:auto;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--orange);color:var(--orange-ink);font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;padding:12px 24px;border-radius:10px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:inherit;border:2px solid currentColor}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}

/* corredores */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.char{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px}
.char[aria-pressed="true"]{border-color:var(--accent-txt);box-shadow:0 0 0 3px var(--orange)}
.char svg{width:84px;height:84px}
.char h3{font-size:30px}
.char .nick{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;color:var(--accent-txt);text-transform:uppercase}
.char .tag{color:var(--muted);font-size:15px}
.perk{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border-radius:10px;padding:8px 10px;font-size:15px;font-weight:700}
.perk i{font-style:normal}

/* perfil */
.profile{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:14px 10px 6px;margin-top:14px}
.profile h2{font-size:26px;padding:0 6px}
.profile svg{width:100%;height:auto;display:block}
.stages{margin-top:14px;display:grid;gap:8px}
.stage{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.stage .alt{flex:0 0 78px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:24px;line-height:1;color:var(--muted)}
.stage .alt small{display:block;font-size:13px;font-weight:600}
.stage.open{border-color:var(--accent-txt)} .stage.open .alt{color:var(--accent-txt)}
.stage.done .alt{color:var(--ok)}
.stage .t{flex:1}
.stage .t b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;text-transform:uppercase;line-height:1.05}
.stage .t span{color:var(--muted);font-size:15px}
.stage[disabled]{opacity:.5;cursor:not-allowed}
.stars{color:var(--accent-txt);letter-spacing:2px;white-space:nowrap}

/* diálogo */
.dlg{display:flex;gap:12px;align-items:flex-start;margin:16px 0}
.dlg svg{flex:0 0 60px;width:60px;height:60px}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;flex:1}
.bubble .who{font-weight:700;font-size:14px;color:var(--accent-txt);display:block}
.dlg.me{flex-direction:row-reverse}
.dlg.me .bubble{border-radius:16px 4px 16px 16px;border-color:var(--accent-txt)}

/* barra de nivel */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--forest);color:#EEF2EC}
.bar .wrap{padding:10px 16px}
.bar .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .st{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;text-transform:uppercase;flex:1;min-width:140px;line-height:1}
.stat{font-weight:700;white-space:nowrap}
.btn-s{border:1.5px solid #5D6D63;background:transparent;color:#EEF2EC;border-radius:8px;padding:3px 11px;font-size:15px;font-weight:700}
.altm{display:flex;align-items:center;gap:10px;margin-top:8px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px}
.altm .track{flex:1;height:8px;background:#2A3A31;border-radius:4px;overflow:hidden}
.altm .fill{height:100%;background:var(--orange);transition:width .6s ease}

/* pregunta */
.task{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
.qid{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;background:var(--bg);border-radius:6px;padding:2px 8px;color:var(--muted)}
.task .q{font-size:20px;font-weight:500;margin:10px 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:left;font-size:17px;position:relative}
.opt .l{flex:0 0 32px;height:32px;border-radius:8px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px}
.opt .tx{flex:1}
.opt[disabled]{cursor:default}
.opt.wrong{opacity:.55;text-decoration:line-through;border-color:var(--ko)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.beacon{border-color:var(--accent-txt);box-shadow:0 0 0 2px var(--orange)}

.sheet h2{font-size:36px;margin-bottom:8px}

.bank-q{border-top:1px solid var(--line);padding:10px 0}

.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}

 escoba:{name:'Toño, el corredor escoba',av:{id:'to',bg:'#FFE7A8',skin:'#F0C8A8',hair:'#8B8B8B',style:'bald',shirt:'#F2C230',beard:true,beardc:'#9A9A9A'}},
 avi:{name:'Lucía, voluntaria del avituallamiento',av:{id:'lu',bg:'#E1F3E8',skin:'#C98E64',hair:'#4A2C1A',style:'curly',shirt:'#2E8B57'}},

};

/* ---------- banco de preguntas ----------
   Formato: [id, pregunta, [CORRECTA, incorrecta, incorrecta, incorrecta], pista, explicación]
   La primera opción es siempre la correcta (el juego las baraja al mostrarlas). */
const STAGES=[
 {name:'Las Aguas',alt:20,topic:'Material',who:'coach',club:[['C1-01','Prenda característica que lleva Mario:',['Sombrero','Capa','Ropa fosforita','Calcetines hasta la rodilla'],'Le protege del sol y ya es parte de su imagen.','¡El sombrero! Si ves uno subiendo por la sierra, es Mario.']],
  intro:'Bienvenidos a la Sierra San Cristóbal. Primer punto: Las Aguas. Antes de pensar en correr, hay que saber qué llevas encima. Revisión de material.',
  outro:'Mochila revisada. Seguimos hacia Pocillos.',
  qs:[
  ['1-01','¿Qué es el «material obligatorio» de una carrera de trail?',['El que exige la organización y puede revisar; si no lo llevas, te pueden penalizar o descalificar','El material que recomiendan las marcas patrocinadoras','Lo que lleva el corredor escoba','Un consejo opcional para principiantes'],'Piensa en qué pasa si en un control te piden la manta térmica y no la tienes.','Es la lista que fija el reglamento. Puede revisarse en la salida o en cualquier control, y no llevarlo conlleva penalización o descalificación.'],
  ['1-02','¿Para qué sirve la manta térmica?',['Para conservar el calor corporal en una emergencia y evitar la hipotermia','Para sentarse en el avituallamiento','Para secar el sudor','Para hacer sombra en verano'],'Si te lesionas y tienes que esperar parado en la montaña…','Si un corredor queda inmovilizado, pierde calor muy rápido. La manta térmica ayuda a conservarlo hasta que llegue la ayuda.'],
  ['1-03','Te pierdes y necesitas ayuda. ¿Cuál es la señal internacional de socorro en montaña con el silbato?',['Seis pitidos por minuto, una pausa de un minuto y repetir','Un pitido largo cada hora','Tres pitidos seguidos y ya','Pitar sin parar hasta quedarte sin aire'],'Es un número par y se repite cada minuto.','La señal de socorro alpina son seis señales por minuto (una cada diez segundos), un minuto de pausa y repetir. La respuesta de quien te oye son tres señales por minuto.'],
  ['1-04','¿Qué chaqueta suele pedir el material obligatorio?',['Impermeable y con capucha','Un cortavientos de papel','Una sudadera de algodón','Cualquier chaqueta, aunque sea vaquera'],'Tiene que protegerte de verdad si llueve arriba.','Lo habitual es una chaqueta impermeable con capucha. Muchas carreras exigen además costuras selladas y una columna de agua mínima.'],
  ['1-05','¿Qué diferencia principal tiene una zapatilla de trail frente a una de asfalto?',['La suela con tacos, que agarra mejor en tierra, barro y piedra','Que siempre es más pesada','Que no tiene cordones','Que solo existe en color marrón'],'Mira la suela.','La suela con tacos (y su compuesto de goma) da agarre en terreno irregular. Muchas incluyen además más protección frente a piedras.'],
  ['1-06','¿Qué es el «drop» de una zapatilla?',['La diferencia de altura entre el talón y la parte delantera del pie','El peso de la zapatilla','La profundidad de los tacos','El número de kilómetros que aguanta'],'Se mide en milímetros y compara dos zonas del pie.','El drop es la diferencia de altura entre el talón y el antepié. Un drop bajo deja el pie más plano.'],
  ['1-07','Tu carrera pasa de noche. ¿Qué es imprescindible además del frontal?',['Pilas o batería de repuesto','Una segunda gorra','Gafas de sol','Un paraguas'],'¿Qué pasa si el frontal se apaga a mitad de bajada?','Un frontal sin batería te deja a oscuras en plena montaña. Por eso suele exigirse llevar pilas o batería de repuesto (o un segundo frontal).'],
  ['1-08','En trail, ¿qué es un «flash»?',['Un bidón blando y plegable para llevar agua en el chaleco','Una foto que te hacen en meta','Un sprint final','Una luz de emergencia'],'Va en los bolsillos delanteros del chaleco.','El flask o flash es un bidón blando que se pliega al vaciarse. Se lleva en el chaleco de hidratación y no rebota.']
 ]},
 {name:'Pocillos',alt:35,topic:'Hidratación y nutrición',who:'avi',club:[['C2-01','Cuando haya dinero en el club, queremos que Diego compre…',['Una carpa','Parches','Gorras','Chuches'],'Algo que se monta en las carreras para tener sombra y punto de encuentro.','¡Una carpa! Para que Physical Train3ing tenga su campamento base en cada carrera.']],
  intro:'¡Avituallamiento en Pocillos! Agua, isotónico, fruta y alguna pregunta. Comer bien también se entrena.',
  outro:'Bien hidratado y con energía. Próxima parada: el Depósito de agua.',
  qs:[
  ['2-01','¿Cuándo es mejor beber durante una carrera larga?',['Poco y a menudo, sin esperar a tener mucha sed','Solo cuando tengas mucha sed','Todo de golpe en cada avituallamiento','Solo al llegar a meta'],'Piensa en sorbos, no en litros.','Beber pequeñas cantidades con frecuencia ayuda a mantener la hidratación sin sobrecargar el estómago.'],
  ['2-02','¿Para qué sirven las sales minerales (electrolitos)?',['Para reponer el sodio y otros minerales que se pierden con el sudor','Para que el agua sepa mejor','Para engordar los músculos','Para dormir mejor después'],'El sudor no es solo agua: sabe salado.','Con el sudor se pierden sodio y otros minerales. Reponerlos ayuda a mantener el equilibrio del cuerpo en esfuerzos largos.'],
  ['2-03','¿Qué es la hiponatremia?',['Un nivel de sodio en sangre demasiado bajo, por ejemplo por beber mucha agua sin sales','Un tipo de lesión de rodilla','Quedarse sin batería en el reloj','Un exceso de azúcar'],'«Hipo» significa bajo; «natrium» es sodio.','La hiponatremia es tener poco sodio en sangre. Puede aparecer al beber grandes cantidades de agua sin reponer sales. Es peligrosa.'],
  ['2-04','¿Con qué conviene tomar un gel energético?',['Con agua','Con nada, a palo seco','Con otro gel','Con leche'],'Los geles están muy concentrados.','Los geles son muy concentrados. Tomarlos con agua facilita la digestión y la absorción.'],
  ['2-05','En una carrera de varias horas, ¿cuántos hidratos de carbono por hora suelen recomendarse como punto de partida?',['Entre 30 y 60 gramos por hora','Ninguno, mejor en ayunas','Medio kilo por hora','Solo al terminar'],'Más o menos lo que llevan uno o dos geles.','Una referencia habitual es de 30 a 60 g por hora. Con entrenamiento del estómago, algunos corredores toleran más. Cada cuerpo es distinto.'],
  ['2-06','¿Qué es una «pájara»?',['Un agotamiento brusco por quedarte sin energía (glucógeno)','Un pájaro que vive en los collados','Un tipo de baliza','Un calambre en el gemelo'],'Te pasa cuando no comes lo suficiente durante la carrera.','La pájara es un bajón repentino de energía cuando se agotan las reservas de glucógeno. Se previene comiendo durante la carrera.'],
  ['2-07','¿Cuál es la regla de oro de la nutrición el día de carrera?',['No probar nada nuevo que no hayas probado entrenando','Probar todo lo que haya en el avituallamiento','Comer el doble de lo normal','Ayunar para ir más ligero'],'Tu estómago también tiene que entrenar.','Geles, barritas o bebidas nuevas pueden sentar mal. Todo lo que uses en carrera debe estar probado en los entrenamientos.'],
  ['2-08','Muchas carreras ya no ponen vasos en los avituallamientos. ¿Qué debes llevar?',['Tu propio vaso plegable o bidones para rellenar','Nada, se bebe del grifo con la mano','Una botella de cristal','Un termo de dos litros'],'Es una medida para reducir residuos.','Para reducir residuos, cada vez más carreras son «sin vasos»: cada corredor lleva su vaso plegable o sus flashes para rellenar.']
 ]},
 {name:'Depósito de agua',alt:50,topic:'Técnica de subida y bastones',who:'coach',club:[['C3-01','¿Cuándo se fundó el club?',['En 2020','En 2019','En 2021','En 2022'],'Fue un año que nadie olvidará, y no precisamente por las carreras.','Physical Train3ing nació en 2020. ¡Y desde entonces, sierra arriba!']],
  intro:'Camino del Depósito de agua empieza a picar hacia arriba. Aquí no gana quien más corre, sino quien mejor sube.',
  outro:'Depósito a la vista. Las piernas arden, pero la cabeza manda. Vamos al Anzuelo.',
  qs:[
  ['3-01','En una subida muy empinada, ¿qué suele ser más eficiente?',['Andar rápido con paso firme','Correr a tope hasta reventar','Pararse cada diez metros','Subir de espaldas'],'Los corredores de élite también lo hacen.','En pendientes fuertes, andar rápido (power hiking) suele ser tan rápido como correr y gasta mucha menos energía.'],
  ['3-02','¿Para qué se apoyan las manos en los muslos o rodillas al subir?',['Para ayudar a empujar con los brazos en pendientes fuertes','Para descansar la espalda tumbándose','Porque es obligatorio en el reglamento','Para limpiarse el sudor'],'Es como añadir otro motor.','Apoyar las manos sobre los muslos permite que los brazos ayuden a empujar en pendientes muy pronunciadas.'],
  ['3-03','¿Cómo deben ser los pasos en una subida?',['Cortos y frecuentes','Largos y saltando','Lo más largos posible','Siempre de puntillas sin apoyar el talón'],'Piensa en el cambio corto de una bici.','Zancadas cortas y frecuentes mantienen el ritmo sin castigar tanto los músculos, como usar un desarrollo corto en bici.'],
  ['3-04','¿Se pueden usar bastones en todas las carreras de trail?',['Depende del reglamento de cada carrera','Sí, siempre y en todas','No, están prohibidos en todas','Solo si llueve'],'Cada carrera tiene sus reglas.','Depende del reglamento. Algunas carreras los prohíben y otras los permiten, a veces con condiciones (por ejemplo, llevarlos durante todo el recorrido si sales con ellos).'],
  ['3-05','En terreno llano o de subida suave, ¿a qué altura se suelen regular los bastones?',['Con el codo formando aproximadamente un ángulo recto','A la altura de la cabeza','Tocando la rodilla','A la altura de los hombros con el brazo estirado'],'Piensa en un ángulo de 90 grados.','Una referencia habitual es que el codo forme un ángulo cercano a 90° al empuñar el bastón con la punta en el suelo.'],
  ['3-06','Vas con bastones y hay corredores justo detrás de ti en un sendero estrecho. ¿Qué haces?',['Llevarlos con las puntas hacia abajo y controladas, sin ir moviéndolos hacia atrás','Agitarlos para abrirte paso','Lanzarlos hacia delante para avanzar','Llevarlos horizontales a la altura de la cara de los demás'],'Las puntas de metal pueden hacer daño.','Las puntas pueden herir a quien va detrás. En zonas con gente, llévalos controlados y con las puntas hacia el suelo.'],
  ['3-07','¿A dónde conviene mirar mientras subes por terreno técnico?',['Unos metros por delante, para planificar dónde pisar','Siempre al reloj','Al cielo','Solo a tus zapatillas'],'Anticiparse evita tropiezos.','Mirar unos metros por delante te permite elegir los apoyos con tiempo y mantener un ritmo fluido.'],
  ['3-08','¿Cómo sabes que llevas un ritmo sostenible en una subida larga?',['Puedes respirar de forma controlada y decir frases cortas','Te falta el aire y no puedes hablar','Te duele la cabeza','Ves borroso'],'Prueba del habla.','Si puedes decir frases cortas, vas a un ritmo que aguantarás. Si no puedes ni hablar, estás quemando energía demasiado rápido.']
 ]},
 {name:'Anzuelo San Cristóbal',alt:65,topic:'Seguridad y meteorología',who:'escoba',club:[['C4-01','¿Quién es el capi?',['Alberto','Jaime','David','Ale'],'Su nombre empieza por A… pero ojo, que hay dos opciones así.','El capi es Alberto. Si se pierde el grupo, se le busca a él.']],
  intro:'Hola, soy Toño, el escoba. Voy el último y recojo a quien se queda atrás. En el Anzuelo hablamos de seguridad, que en el monte el tiempo cambia en minutos.',

const START_ALT=5;

/* ---------- estado ---------- */
let save=store.get('pt_save',{char:null,unlocked:1,stars:{},best:{}});let run=null;
const persist=()=>store.set('pt_save',save);
const me=()=>CHARS.find(c=>c.id===save.char)||CHARS[0];

/* ---------- perfil ---------- */
function profileSVG(){
  const W=360,H=170,pl=30,pr=14,pt=26,pb=22,N=STAGES.length;
  const alts=STAGES.map(x=>x.alt),maxA=Math.max(...alts)*1.15,minA=0;
  const X=i=>pl+(i/N)*(W-pl-pr),Y=a=>pt+(1-(a-minA)/(maxA-minA))*(H-pt-pb);
  const pts=[[0,START_ALT]];STAGES.forEach((st,i)=>{const prev=pts[pts.length-1][1];pts.push([i+.5,(prev+st.alt)/2+(i%2?-4:3)]);pts.push([i+1,st.alt])});
  let d='';pts.forEach(([k,a],j)=>d+=`${j?' L':'M'}${X(k).toFixed(1)} ${Y(a).toFixed(1)}`);
  const area=d+` L${X(N)} ${H-pb} L${X(0)} ${H-pb}Z`;
  const cur=Math.min(save.unlocked,N);
  const marks=STAGES.map((st,i)=>{const n=i+1,done=save.stars[n],open=n<=save.unlocked,col=done?'var(--ok)':open?'var(--orange)':'var(--muted)',x=X(n),y=Y(st.alt);
    return `<g><line x1="${x}" y1="${y}" x2="${x}" y2="${H-pb}" stroke="${col}" stroke-dasharray="2 3" opacity=".6"/>
    <circle cx="${x}" cy="${y}" r="${n===cur&&!done?9:6}" fill="${col}" stroke="var(--card)" stroke-width="2" ${n===cur&&!done?'class="pulse"':''}/>
    <text x="${x}" y="${y-12}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)" font-family="Barlow Condensed,sans-serif">${st.alt}</text>
    <text x="${x}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)">${n}</text></g>`}).join('');
  const step=maxA>300?100:25;let grid='';for(let a=step;a<maxA;a+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(a)}" y2="${Y(a)}" stroke="var(--line)"/><text x="${pl-4}" y="${Y(a)+3}" text-anchor="end" font-size="9" fill="var(--muted)">${a}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Perfil de la subida: de ${STAGES[0].name} a ${STAGES[N-1].name}, ${STAGES[N-1].alt} m"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--orange)" stop-opacity=".45"/><stop offset="1" stop-color="var(--orange)" stop-opacity=".04"/></linearGradient></defs>
  ${grid}<path d="${area}" fill="url(#pg)"/><path d="${d}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="${X(0)}" cy="${Y(START_ALT)}" r="5" fill="var(--ink)"/><text x="${X(0)+6}" y="${Y(START_ALT)-8}" font-size="9" fill="var(--muted)">Salida</text>${marks}</svg>`;
}

  <div class="actions"><button class="btn" onclick="closeModal()">Cerrar</button></div>`)}
function openModal(h){$('#sheet').innerHTML=h;$('#modal').classList.remove('hidden');document.body.classList.add('lock');$('#sheet').scrollTop=0;const b=$('#sheet .btn');if(b&&$('#sheet').scrollHeight<=$('#sheet').clientHeight)b.focus()}

  $$('.char').forEach(b=>b.onclick=()=>{tmpChar=b.dataset.id;renderChars();const ok=$('#charOk');if(ok.scrollIntoView)ok.scrollIntoView({behavior:'smooth',block:'center'})});$('#charOk').disabled=!tmpChar}
function renderMap(){const c=me(),done=Object.keys(save.stars).length;
  const line=done===0?`Dorsal puesto. Salimos hacia Las Aguas. ¡A por La Antena!`:done===STAGES.length?'¡He llegado a La Antena! Puedo repetir fases para sacar las tres estrellas.':`Siguiente control: ${STAGES[Math.min(done,STAGES.length-1)].name}, a ${fmtAlt(STAGES[Math.min(done,STAGES.length-1)].alt)}.`;
  $('#mHead').innerHTML=avatar(c.av)+`<div class="bubble"><span class="who">${c.name} «${c.nick}»</span>${line}</div>`;
  $('#profileSvg').innerHTML=profileSVG();
  $('#stages').innerHTML=STAGES.map((s,i)=>{const n=i+1,st=save.stars[n]||0,open=n<=save.unlocked;return `<button class="stage ${st?'done':open?'open':''}" data-s="${i}" ${open?'':'disabled'}>
    <span class="alt">${s.alt.toLocaleString('es-ES')}<small>metros</small></span><span class="t"><b>${s.name}</b><span>Fase ${n} · ${s.topic}</span></span>
    <span class="stars">${open?'★'.repeat(st)+'☆'.repeat(3-st):'🔒'}</span></button>`}).reverse().join('');
  $$('.stage').forEach(b=>b.onclick=()=>startStage(+b.dataset.s));
  const tot=Object.values(save.best).reduce((a,b)=>a+b,0);$('#totalScore').textContent=(tot?`Puntos acumulados: ${tot.toLocaleString('es-ES')}. `:'')+(canSave?'':'Este navegador no permite guardar el progreso: se mantiene mientras no cierres la página.')}

/* ---------- partida ---------- */
function startStage(i){const c=me(),S=STAGES[i];
  run={s:i,idx:0,lives:c.id==='cabra'?4:3,maxLives:c.id==='cabra'?4:3,score:0,hintLeft:c.id==='veterana'?1:0,results:[],
    qs:(()=>{const g=shuffle(S.qs);return S.club.length?[g[0],g[1],pick(S.club)]:g.slice(0,3)})(),from:i===0?START_ALT:STAGES[i-1].alt,to:S.alt};
  show('level');$('#lvTitle').textContent=`Fase ${i+1} · ${S.name}`;$('#altFrom').textContent=fmtAlt(run.from);$('#altTo').textContent=fmtAlt(run.to);updBar();
  const st=$('#stage');const n=NPC[S.who];
  st.innerHTML=`<div class="dlg">${avatar(n.av)}<div class="bubble"><span class="who">${n.name}</span>${S.intro}</div></div><div class="actions"><button class="btn" id="goBtn">¡A correr!</button></div>`;
  $('#goBtn').focus();$('#goBtn').onclick=renderQ}
function updBar(){$('#lvLives').textContent='💧'.repeat(run.lives)+'·'.repeat(Math.max(0,run.maxLives-run.lives));$('#lvLives').setAttribute('aria-label',`${run.lives} flashes de agua`);
  $('#lvScore').textContent=`${run.score} pts`;$('#altFill').style.width=(run.idx/PER_STAGE*100)+'%'}
function curAlt(){return Math.round(run.from+(run.to-run.from)*run.idx/PER_STAGE)}
function renderQ(){
  const q=run.qs[run.idx];run.tries=0;run.locked=false;run.hinted=false;
  run.order=shuffle([0,1,2,3]);
  $('#stage').innerHTML=`<div class="task"><span class="qid">Pregunta ${run.idx+1} de ${PER_STAGE} · ${q[0]} · ${fmtAlt(curAlt())}</span>${q[0].startsWith('C')?' <span class="qid" style="background:var(--orange);color:#13201A">Pregunta del club</span>':''}
    <p class="q">${q[1]}</p>
    <div class="opts">${run.order.map((o,j)=>`<button class="opt" data-o="${o}"><span class="l">${'ABCD'[j]}</span><span class="tx">${q[2][o]}</span></button>`).join('')}</div>
    <div id="fb"></div><div class="actions" id="acts">${run.hintLeft>0?'<button class="btn sec" id="hintBtn">🧭 Usar pista (1 por fase)</button>':''}</div></div>`;
  $$('.opt').forEach(b=>b.onclick=()=>answer(b));
  const h=$('#hintBtn');if(h)h.onclick=()=>{run.hintLeft--;run.hinted=true;h.remove();fb('info',`<b>Pista de Pili:</b> ${q[3]}`)};
}
const fb=(k,h)=>$('#fb').innerHTML=`<div class="fb ${k}" role="status">${h}</div>`;
function answer(b){
  if(run.locked||b.disabled)return;
  const q=run.qs[run.idx],o=+b.dataset.o,c=me();
  if(o===0){
    const p=run.tries===0?100:50;run.score+=p;run.results[run.idx]=true;b.classList.add('right');
    finishQ(`<b>¡Correcto! +${p} pts.</b> <i>${c.name}: «${pick(c.ok)}»</i><br>${q[4]}`,'ok');return}
  run.tries++;run.lives--;b.classList.add('wrong');b.disabled=true;updBar();
  if(run.lives<=0)return dnf();
  if(run.tries>=2){run.results[run.idx]=false;const r=$$('.opt').find(x=>+x.dataset.o===0);r.classList.add('right');
    finishQ(`<b>Esta vez no.</b> <i>${c.name}: «${pick(c.ko)}»</i><br>${q[4]}`,'ko');return}
  let msg=`<b>Respuesta incorrecta. Pierdes un flash de agua.</b> <i>${c.name}: «${pick(c.ko)}»</i><br>Te queda un intento.`;
  if(c.id==='lince'){
    const cands=$$('.opt').filter(x=>!x.disabled&&+x.dataset.o!==0);const other=pick(cands);const right=$$('.opt').find(x=>+x.dataset.o===0);
    [right,other].forEach(x=>{x.classList.add('beacon');x.insertAdjacentHTML('beforeend',`<span class="flag">${FLAG}Baliza</span>`)});
    msg+=` <b>🚩 Rubén ve dos balizas:</b> la buena es una de las dos marcadas.`}
  fb('ko',msg)}
function finishQ(h,k){run.locked=true;$$('.opt').forEach(x=>x.disabled=true);fb(k,h);
  run.idx++;updBar();const last=run.idx>=PER_STAGE;
  $('#acts').innerHTML=`<button class="btn" id="nBtn">${last?'Llegar al control':'Seguir subiendo ⛰'}</button>`;$('#nBtn').focus();
  $('#nBtn').onclick=()=>last?finishStage():renderQ()}
function dnf(){const c=me();
  openModal(`<div class="end-art">💧</div><h2>Retirada (DNF)</h2><p>${c.name} se ha quedado sin agua a ${fmtAlt(curAlt())}. Toño, el escoba, le acompaña hasta el avituallamiento. La montaña seguirá ahí mañana.</p>
  <div class="actions"><button class="btn" id="gR">Volver a intentarlo</button><button class="btn sec" id="gO">Ver el perfil</button></div>`);
  $('#gR').onclick=()=>{closeModal();startStage(run.s)};$('#gO').onclick=()=>{closeModal();toMap()}}
function finishStage(){
  const S=STAGES[run.s],n=run.s+1,max=PER_STAGE*100,r=run.score/max,st=r>=.9?3:r>=.6?2:1;
  save.stars[n]=Math.max(save.stars[n]||0,st);save.best[n]=Math.max(save.best[n]||0,run.score);save.unlocked=Math.max(save.unlocked,Math.min(STAGES.length,n+1));persist();
  const fin=n===STAGES.length,tot=Object.values(save.best).reduce((a,b)=>a+b,0),maxT=STAGES.length*max;
  const rank=tot/maxT>=.9?'Leyenda de Physical Train3ing':tot/maxT>=.7?'Cabra de montaña':tot/maxT>=.45?'Finisher con honores':'Finisher';
  const npc=NPC[S.who];
  openModal(`<div class="end-art" aria-hidden="true">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><h2>${fin?'¡La Antena!':`Control ${n}: ${S.name}`}</h2>
   <p class="big">${fmtAlt(S.alt)}</p><p><b>${run.score}</b> de ${max} puntos en esta fase.</p>
   <div class="dlg">${avatar(npc.av)}<div class="bubble"><span class="who">${npc.name}</span>${S.outro}</div></div>
   ${fin?`<p>Puntos totales: <b>${tot.toLocaleString('es-ES')}</b> de ${maxT.toLocaleString('es-ES')}. Categoría: <b>${rank}</b>.</p>`:''}
   <div class="tape" style="margin:14px 0"></div>
   <div class="actions">${fin?'':`<button class="btn" id="fN">Siguiente fase</button>`}<button class="btn sec" id="fR">Repetir fase</button><button class="btn sec" id="fO">Ver el perfil</button></div>`);
  const x=$('#fN');if(x)x.onclick=()=>{closeModal();startStage(n)};$('#fR').onclick=()=>{closeModal();startStage(run.s)};$('#fO').onclick=()=>{closeModal();toMap()}}
function toMap(){renderMap();show('map')}

$('#startBtn').onclick=()=>{if(save.char)toMap();else{renderChars();show('chars')}};
$('#charOk').onclick=()=>{save.char=tmpChar;persist();toMap()};
$('#changeChar').onclick=()=>{tmpChar=save.char;renderChars();show('chars')};
$('#resetBtn').onclick=()=>{openModal(`<h2>¿Borrar el progreso?</h2><p>Se perderán las estrellas, los puntos y el corredor elegido.</p><div class="actions"><button class="btn" id="rY">Borrar progreso</button><button class="btn sec" onclick="closeModal()">Cancelar</button></div>`);
  $('#rY').onclick=()=>{save={char:null,unlocked:1,stars:{},best:{}};persist();tmpChar=null;closeModal();$('#startBtn').textContent='Ir a la salida';show('title')}};
$('#exitBtn').onclick=()=>{openModal(`<h2>¿Retirarte de la fase?</h2><p>Perderás el progreso de esta fase.</p><div class="actions"><button class="btn" id="xY">Retirarme</button><button class="btn sec" onclick="closeModal()">Seguir corriendo</button></div>`);$('#xY').onclick=()=>{closeModal();toMap()}};

if(save.char)$('#startBtn').textContent='Volver a la montaña';
</script>
</body>
</html>
